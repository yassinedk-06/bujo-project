name: CI

on: [push, pull_request]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check PEP 8 and Docstrings
        run: flake8 bujo tests --max-line-length=88 --extend-ignore=D203,D213,D401

      - name: Run unit tests with coverage
        run: pytest --cov=bujo tests/